name: Stress Race
on:
  workflow_dispatch:
  pull_request:
    paths: ['internal/**', 'test/**']
jobs:
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Race stress
        run: go test -race -count=100 ./internal/... ./test/...
