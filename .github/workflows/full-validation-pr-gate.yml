name: Full Validation PR Gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOTOOLCHAIN: go1.26.5+auto
  MATHLIB_CACHE_DIR: ${{ github.workspace }}/proofs/.lake/mathlib-cache

jobs:
  full-validation-fast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'go.mod'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      # This is a required status check (branches/main/protection), unlike
      # "Proof-Driven Design Verification / verify-lean-formalization" and
      # "Verify Formal Proofs / verify-lean-formalizations", neither of
      # which is required. Before this, the required gate validated that
      # proofs/FORMAL_TRACEABILITY_MATRIX.md's cross-references were
      # internally consistent (theorem/test symbol names existing somewhere
      # in the tree) but never actually compiled the Lean proofs or ran the
      # vacuous/misleading-theorem lint -- a PR could introduce a new sorry,
      # a new vacuous theorem, or a Lean file that doesn't even compile, and
      # merge to main cleanly. The composite action below closes that gap by
      # running the same real checks verify-lean-formalization already runs,
      # directly in the required job instead of a non-required sibling.
      #
      # remove-tools-dir is deliberately left at its 'false' default here,
      # unlike the other two callers of this action: this job already ran
      # actions/setup-go and actions/setup-python above and also
      # builds/tests Go code later in the same job, so clearing the tool
      # cache here risks breaking those later steps.
      - name: Build and lint Lean formal proofs
        uses: ./.github/actions/lean-build-and-lint

      - name: Validate formal report consistency and bundle integrity
        run: |
          chmod +x scripts/ci/generate_formal_proof_artifacts.sh scripts/ci/validate_formal_traceability.sh
          ./scripts/ci/validate_formal_traceability.sh
          ./scripts/ci/generate_formal_proof_artifacts.sh
          python3 scripts/ci/generate_formal_validation_report.py
          python3 scripts/ci/generate_formal_validation_report.py --check
          python3 scripts/ci/build_formal_verification_bundle.py
          python3 scripts/ci/verify_formal_verification_bundle.py

      - name: Run formal validation tooling tests
        run: |
          make validate-formal-tooling-tests

      - name: Verify orchestrator FIPS build metadata wiring
        run: |
          source scripts/ensure_go_toolchain.sh
          go build \
            -ldflags "-X main.buildVersion=ci-fips -X main.buildCommit=${GITHUB_SHA} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            ./cmd/orchestrator

      - name: Verify FIPS runtime mode (fail-fast)
        run: |
          source scripts/ensure_go_toolchain.sh
          GODEBUG=fips140=on go run ./scripts/fips_runtime_check

      - name: Run FIPS regression tests (TLS/keygen/signing)
        run: |
          source scripts/ensure_go_toolchain.sh
          GODEBUG=fips140=on MOHAWK_REQUIRE_FIPS_MODE_FOR_TESTS=true go test ./test -run '^TestFIPSRegression$'

      - name: Run full validation fast profile
        run: python3 tests/scripts/python/run_full_validation_suite.py --profile fast

      - name: Check validation trends
        run: python3 tests/scripts/ci/check_validation_trends.py

      - name: Write validation diff summary
        run: python3 tests/scripts/ci/write_validation_diff_summary.py

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-validation-fast-artifacts
          path: "test-results/full-validation/"
