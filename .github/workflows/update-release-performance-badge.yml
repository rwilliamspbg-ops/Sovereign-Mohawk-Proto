name: Update Release Performance Badge

on:
  workflow_run:
    workflows: ["Release Performance Evidence"]
    types: [completed]
  schedule:
    - cron: "15 */12 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-badge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Compute latest release performance runtime badge
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          WORKFLOW_RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail

          created_at="${WORKFLOW_RUN_CREATED_AT:-}"
          updated_at="${WORKFLOW_RUN_UPDATED_AT:-}"

          if [ -z "$created_at" ] || [ -z "$updated_at" ] || [ "$created_at" = "null" ] || [ "$updated_at" = "null" ]; then
            run_json="$(gh api /repos/${GITHUB_REPOSITORY}/actions/workflows/release-performance-evidence.yml/runs -f status=completed -f conclusion=success -f per_page=1 2>/dev/null || true)"
            created_at="$(echo "$run_json" | jq -r '.workflow_runs[0].created_at // empty')"
            updated_at="$(echo "$run_json" | jq -r '.workflow_runs[0].updated_at // empty')"
          fi

          if [ -z "$created_at" ] || [ -z "$updated_at" ] || [ "$created_at" = "null" ] || [ "$updated_at" = "null" ]; then
            echo "No usable timestamps found for release-performance-evidence workflow; skipping badge update."
            exit 0
          fi

          CREATED_AT="$created_at" UPDATED_AT="$updated_at" python3 - <<'PY'
          from datetime import datetime
          import json
          from pathlib import Path
          import os

          created = datetime.fromisoformat(os.environ["CREATED_AT"].replace("Z", "+00:00"))
          updated = datetime.fromisoformat(os.environ["UPDATED_AT"].replace("Z", "+00:00"))
          seconds = max(0, int((updated - created).total_seconds()))
          mins, secs = divmod(seconds, 60)
          message = f"{mins}m {secs}s"

          if seconds <= 90:
              color = "2ea043"
          elif seconds <= 180:
              color = "d29922"
          else:
              color = "d73a49"

          payload = {
              "schemaVersion": 1,
              "label": "Latest Release Performance Gate",
              "message": message,
              "color": color,
          }

          content = json.dumps(payload, indent=2) + "\n"

          out = Path("results/metrics/latest_release_performance_badge.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(content, encoding="utf-8")

          # Also persist to /tmp so the file survives a branch switch.
          Path("/tmp/badge.json").write_text(content, encoding="utf-8")

          print(f"badge message: {message}")
          PY

      - name: Commit badge update if changed
        run: |
          set -euo pipefail
          badge_file="results/metrics/latest_release_performance_badge.json"
          if ! git ls-files --error-unmatch "$badge_file" 2>/dev/null && [ ! -f "$badge_file" ]; then
            echo "No badge file to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Push badge artifact to a dedicated unprotected branch so that
          # branch-protection rules on main are not violated.
          badges_branch="badges"
          git fetch origin "${badges_branch}:refs/remotes/origin/${badges_branch}" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/${badges_branch}"; then
            git checkout -B "${badges_branch}" "origin/${badges_branch}"
          else
            git checkout --orphan "${badges_branch}"
            git reset --hard
          fi

          # Re-generate the badge file in the new branch context.
          mkdir -p results/metrics
          cp /tmp/badge.json results/metrics/latest_release_performance_badge.json 2>/dev/null || true

          # Stage badge file (force because results/** may be gitignored).
          git add -f results/metrics/latest_release_performance_badge.json

          if git diff --cached --quiet; then
            echo "No badge update needed."
            exit 0
          fi

          git commit -m "docs: refresh release performance gate badge"

          for attempt in 1 2 3; do
            echo "Attempt ${attempt}: pushing to ${badges_branch}"
            if git push origin "HEAD:${badges_branch}"; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Failed to push badge update after 3 attempts."
          exit 1
