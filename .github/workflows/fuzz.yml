name: Fuzz Testing

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'internal/**'
      - 'test/**'
      - '.github/workflows/fuzz.yml'
  push:
    branches: [ main ]
    paths:
      - 'internal/**'
      - 'test/**'
      - '.github/workflows/fuzz.yml'

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: "1.27.4"

      - name: Fuzz accelerator
        run: go test ./internal/accelerator/... -fuzz=FuzzAggregateParallel -fuzztime=60s

      - name: Fuzz batch verifier
        run: go test ./internal/batch/... -fuzz=FuzzVerifySignatures -fuzztime=60s
      - name: Fuzz wasm verifier
        run: go test ./internal/wasmhost/... -fuzz=FuzzVerifyRejectsMalformedProofs -fuzztime=60s

      - name: Fuzz hbft simulator
        run: go test ./internal/hbft/... -fuzz=FuzzNewSimulator -fuzztime=60s

      - name: Fuzz proofs verifier
        run: go test ./internal/proofs/... -fuzz=FuzzVerifyHashCommitment -fuzztime=60s

      - name: Fuzz threshold aggregation
        run: go test ./test/ -run '^FuzzThresholdAggAggregate$' -fuzz '^FuzzThresholdAggAggregate$' -fuzztime=20s

      - name: Fuzz manifest signature
        run: go test ./test/ -run '^FuzzManifestSignature$' -fuzz '^FuzzManifestSignature$' -fuzztime=20s

      - name: Fuzz hash-commitment verifier (semantic oracle)
        run: go test ./test/ -run '^FuzzVerifyHashCommitmentSemantic$' -fuzz '^FuzzVerifyHashCommitmentSemantic$' -fuzztime=20s

      - name: Fuzz RDP accountant
        run: go test ./test/ -run '^FuzzRDPShardStepSemantic$' -fuzz '^FuzzRDPShardStepSemantic$' -fuzztime=20s

      - name: Fuzz scheduler auction
        run: go test ./test/ -run '^FuzzSchedulerAllocateSemantic$' -fuzz '^FuzzSchedulerAllocateSemantic$' -fuzztime=20s
