name: Build and Deploy Lean Blueprint

# This repository's default Pages site is deployed by static.yml, which uses
# the same `pages` concurrency group. To avoid two workflows fighting over one
# environment, blueprint publication is an explicit manual deployment.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-blueprint"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain and build project
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          auto-config: false
          build: true
          lake-package-directory: proofs

      - name: Install blueprint toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended latexmk graphviz libgraphviz-dev
          pip install leanblueprint

      - name: Verify \lean{} tags and build blueprint web pages
        run: bash scripts/ci/build_blueprint.sh

      - name: Build doc-gen4 API documentation
        working-directory: proofs
        env:
          # DISABLE_EQUATIONS avoids generating equational lemmas for every
          # imported Mathlib definition; that phase was the memory spike.
          DISABLE_EQUATIONS: '1'
          LEAN_NUM_THREADS: '1'
        run: lake -R -Kenv=dev build LeanFormalization:docs

      - name: Assemble GitHub Pages artifact
        run: |
          mkdir -p _site/docs
          cp -r proofs/blueprint/web/* _site/
          cp -r proofs/.lake/build/doc/* _site/docs/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
