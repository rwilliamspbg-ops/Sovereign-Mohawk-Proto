name: Build and Deploy Lean Blueprint

# Blueprint is now the sole automatic publisher to GitHub Pages.
# static.yml is manual-only so it cannot overwrite this deployment.
# The LaTeX web build runs on a hosted runner (needs TeX + sudo); the
# memory-hungry doc-gen4 build runs on the Desk-Mini self-hosted runner.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  blueprint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain and build project
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          auto-config: false
          build: true
          lake-package-directory: proofs

      - name: Install blueprint toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended latexmk graphviz libgraphviz-dev
          pip install leanblueprint

      - name: Verify \lean{} tags and build blueprint web pages
        run: bash scripts/ci/build_blueprint.sh

      - name: Upload blueprint web artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: blueprint-web
          path: proofs/blueprint/web

  project-docs:
    runs-on: [self-hosted, docgen]
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain and build project
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          auto-config: false
          build: true
          lake-package-directory: proofs

      - name: Build doc-gen4 API documentation
        working-directory: proofs
        # doc-gen4 d555f83 (v4.30.0-rc2) blocks on srcUri.github inside
        # modJob.mapM, which inflates the Lake worker pool until git spawns
        # fail with ENOMEM (doc-gen4#434/#435). LEAN_NUM_THREADS is not a
        # hard cap there; use the documented file:// facet until the pinned
        # doc-gen4 is upgraded. Source links in the API pages are runner-local.
        env:
          DISABLE_EQUATIONS: '1'
          LEAN_NUM_THREADS: '2'
          DOCGEN_SRC: 'file'
        run: lake -R -Kenv=dev build LeanFormalization:docs

      - name: Upload doc-gen4 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: project-docs
          path: proofs/.lake/build/doc

  assemble:
    runs-on: ubuntu-latest
    needs: [blueprint-web, project-docs]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: blueprint-web
          path: _site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: project-docs
          path: _site/docs
      - name: Disable Jekyll
        run: touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
