name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Prepare deploy metadata
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          BUILD_TIME_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf "%s\n" "${GITHUB_SHA}" > .build-sha.txt
          printf "%s\n" "${BUILD_TIME_UTC}" > .build-time-utc.txt
          cat > .build-metadata.json <<EOF
          {
            "sha": "${GITHUB_SHA}",
            "sha_short": "${SHORT_SHA}",
            "built_at_utc": "${BUILD_TIME_UTC}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF
          touch .nojekyll
      - name: Validate deploy metadata files
        run: |
          set -euo pipefail
          test -s .build-sha.txt
          test -s .build-time-utc.txt
          test -s .build-metadata.json
          grep -q '"sha"' .build-metadata.json
          grep -q '"built_at_utc"' .build-metadata.json
          grep -q '"run_number"' .build-metadata.json
      - name: Log deploy metadata for audit trail
        run: |
          set -euo pipefail
          echo "Deploy metadata JSON:"
          cat .build-metadata.json
          echo ""
          echo "Deploy metadata SHA-256:"
          sha256sum .build-metadata.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: '.'
      - name: Wait for the Pages artifact to reach the Actions API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages"
          for attempt in $(seq 1 30); do
            body="${RUNNER_TEMP}/pages-artifacts.json"
            status="$(curl -sS -o "${body}" -w '%{http_code}' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${url}")"
            if [ "${status}" != "200" ]; then
              echo "::error::Actions artifacts API returned HTTP ${status}"
              cat "${body}"
              exit 1
            fi
            count="$(jq -r '.total_count // 0' "${body}")"
            if [ "${count}" -gt 0 ]; then
              echo "github-pages artifact visible to the Actions API after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::github-pages artifact never became visible; deploy-pages would abort with 'No artifacts named github-pages were found'"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
