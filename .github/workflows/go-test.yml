name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: go-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOTOOLCHAIN: go1.26.4+auto

jobs:
  go-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'

      - name: Run Go tests
        run: |
          mkdir -p test-results
          source scripts/ensure_go_toolchain.sh
          set -o pipefail
          go test -json -covermode=atomic -coverprofile=test-results/go-coverage.out ./... | tee test-results/go-test-report.jsonl
          go tool cover -func=test-results/go-coverage.out > test-results/go-coverage-summary.txt

      - name: Upload Go test artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-test-report
          path: |
            test-results/go-test-report.jsonl
            test-results/go-coverage.out
            test-results/go-coverage-summary.txt
