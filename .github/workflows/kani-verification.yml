name: Kani Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: kani-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  kani:
    name: Kani formal verification (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown

      - name: Install Kani
        run: |
          if ! command -v kani >/dev/null 2>&1; then
            cargo install --locked kani-verifier
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          kani --version

      - name: Run Kani
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd wasm-modules/fl_task
          cargo kani
