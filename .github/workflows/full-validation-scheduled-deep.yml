name: Full Validation Scheduled Deep

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOTOOLCHAIN: go1.26.5+auto

jobs:
  full-validation-deep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'go.mod'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Run full validation deep profile
        run: python3 tests/scripts/python/run_full_validation_suite.py --profile deep

      - name: Check validation trends
        run: python3 tests/scripts/ci/check_validation_trends.py --window 20 --min-pass-rate 0.70

      - name: Write validation diff summary
        run: python3 tests/scripts/ci/write_validation_diff_summary.py

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-validation-deep-artifacts
          path: test-results/full-validation/
